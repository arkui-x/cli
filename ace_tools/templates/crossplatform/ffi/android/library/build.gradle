plugins {
    id 'com.android.library'
}
android {
    namespace 'com.example.module_name'
    compileSdk 34
    buildFeatures {
        buildConfig false
    }
    defaultConfig {
        minSdk 24
        targetSdk 34
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        consumerProguardFiles 'consumer-rules.pro'
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
